<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0f12">
<title>KINK metadata-test</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--card:#191c22;--line:#30343d;--green:#d9ff42;--text:#f4f5f7;--muted:#9da3ae;--warn:#ff8a5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif;padding:14px}
h1{font-size:18px;margin:0 0 4px}
p{color:var(--muted);margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{border:0;border-radius:12px;min-height:46px;padding:8px 14px;font:700 14px system-ui;background:#2a2e36;color:var(--text)}
button.on{background:var(--green);color:#0d0f12}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
#state{font-size:20px;font-weight:900}
#state.ad{color:var(--warn)}
#log{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:55vh;overflow:auto}
.ad{color:var(--warn)}.empty{color:var(--muted)}.err{color:var(--warn)}
</style>
</head>
<body>
<h1>KINK metadata-test</h1>
<p>Leest de now playing-gegevens van KINK en logt reclamemarkeringen. Laat hem een uur draaien en kopieer dan de log.</p>

<div class="card"><div id="state">Nog niet gestart</div><div id="sub" style="color:var(--muted)"></div></div>

<div class="row">
  <button id="poll">Start polling</button>
  <button id="sbm">Test sideband</button>
  <button id="copy">Kopieer log</button>
  <button id="clear">Wis log</button>
</div>
<audio id="a" controls preload="none" style="width:100%;margin-bottom:10px"></audio>
<div class="card"><div id="log"></div></div>

<script>
const $=id=>document.getElementById(id);
const NP='https://np.tritondigital.com/public/nowplaying?mountName=KINK&numberToFetch=10';
const seen=new Set();let pollTimer=null,es=null,lines=[];
try{lines=JSON.parse(localStorage.getItem('km_log')||'[]')}catch(e){}
function t(ms){return new Date(ms).toLocaleTimeString('nl-NL')}
function log(s,cls){
  lines.push({s:t(Date.now())+'  '+s,cls:cls||''});if(lines.length>2000)lines=lines.slice(-2000);
  try{localStorage.setItem('km_log',JSON.stringify(lines))}catch(e){}
  render();
}
function render(){$('log').innerHTML=lines.slice().reverse().map(l=>'<div class="'+l.cls+'">'+l.s.replace(/</g,'&lt;')+'</div>').join('')}
function setState(txt,ad,sub){$('state').textContent=txt;$('state').classList.toggle('ad',!!ad);$('sub').textContent=sub||''}

/* Methode 1: now playing API pollen */
async function poll(){
  try{
    const r=await fetch(NP+'&_='+Date.now(),{cache:'no-store'});
    const x=new DOMParser().parseFromString(await r.text(),'text/xml');
    const items=[...x.querySelectorAll('nowplaying-info')].map(n=>{
      const p={};n.querySelectorAll('property').forEach(q=>p[q.getAttribute('name')]=q.textContent);
      return {type:n.getAttribute('type'),start:+p.cue_time_start||0,dur:+p.cue_time_duration||0,title:p.cue_title||'',artist:p.track_artist_name||'',adType:p.ad_type||''};
    }).sort((a,b)=>a.start-b.start);
    for(const i of items){
      const k=i.type+i.start;if(seen.has(k))continue;seen.add(k);
      if(i.type==='ad')log('[start '+t(i.start)+'] RECLAME  '+i.title+' ('+i.adType+')','ad');
      else if(!i.title)log('[start '+t(i.start)+'] zonder titel  '+Math.round(i.dur/1000)+' s','empty');
      else log('[start '+t(i.start)+'] '+i.artist+' - '+i.title+'  '+Math.round(i.dur/1000)+' s');
    }
    const last=items[items.length-1];
    if(!last)return setState('Geen gegevens',false);
    const inBreak=last.type==='ad'||!last.title;
    setState(inBreak?'Reclame of jingle':'Muziek',inBreak,last.title?(last.artist+' - '+last.title):('sinds '+t(last.start)));
  }catch(e){log('Polling mislukt: '+e.message+' (waarschijnlijk CORS)','err');setState('Polling werkt niet',true,e.message)}
}
$('poll').onclick=()=>{
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;$('poll').textContent='Start polling';$('poll').classList.remove('on');log('Polling gestopt');return}
  log('Polling gestart (elke 10 s)');poll();pollTimer=setInterval(poll,10000);
  $('poll').textContent='Stop polling';$('poll').classList.add('on');
};

/* Methode 2: sideband metadata (SSE), gesynchroniseerd met de audio */
const SIDS=['22343','22723','29093','22323','25223'];
function uuid(){return crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))}
$('sbm').onclick=()=>{
  if(es){es.close();es=null;$('a').pause();$('sbm').classList.remove('on');log('Sideband gestopt');return}
  const id=uuid(),host='https://'+SIDS[Math.floor(Math.random()*SIDS.length)]+'.live.streamtheworld.com';
  $('a').src=host+'/KINK_SC?sbmid='+id;$('a').play().catch(e=>log('Audio start niet: '+e.message,'err'));
  es=new EventSource(host+'/KINK_SBM?sbmid='+id);
  es.onopen=()=>log('Sideband verbonden met '+host);
  es.onerror=()=>log('Sideband-fout of verbinding verbroken (CORS of server)','err');
  es.onmessage=ev=>{
    let d;try{d=JSON.parse(ev.data)}catch(e){return log('SBM ruw: '+ev.data.slice(0,200))}
    const p=d.parameters||{};
    if(d.name==='ad')log('SBM RECLAME  '+(p.cue_title||'')+' type='+(p.ad_type||'')+' duur='+(p.cue_time_duration||'?'),'ad');
    else log('SBM '+d.type+' '+d.name+'  '+(p.track_artist_name||'')+' '+(p.cue_title||'')+' t='+d.timestamp+' audio='+Math.round($('a').currentTime*1000));
  };
  $('sbm').classList.add('on');log('Sideband-test gestart');
};

$('copy').onclick=async()=>{const txt=lines.map(l=>l.s).join('\n');try{await navigator.clipboard.writeText(txt);$('copy').textContent='Gekopieerd'}catch(e){prompt('Kopieer de log',txt)}};
$('clear').onclick=()=>{lines=[];seen.clear();try{localStorage.removeItem('km_log')}catch(e){}render()};
render();
</script>
</body>
</html>
